<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- ここは「HTML を入れる箱」専用のページ。殻（index.html）は厳しい CSP のまま、ゲームや指南書に必要な inline script だけをこの箱の中で許す。
     中身の HTML は、さらに sandbox（allow-same-origin なし）の iframe に入れる＝殻の localStorage（トークン）には触れない。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src data: blob: https://fonts.gstatic.com; img-src data: blob: https:; media-src data: blob:; connect-src 'self' data: blob:; frame-src blob: data:; worker-src blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>HTML の箱</title>
<style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<script type="module" src="js/frame.js"></script>
</body>
</html>
